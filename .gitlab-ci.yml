stages:
  - build_test
  - push_test
  - deploy_test

variables:
  DOCKER_HOST: 'unix:///var/run/docker.sock'

build_test:
  image: docker:stable
  stage: build_test
  only:
    - test
  script:
    - docker info # Проверка подключения к Docker
    - docker system prune -a -f
    - docker build -t registry.krasrm.com/pahapasha11/new-lk .

push_test:
  image: docker:stable
  stage: push_test
  only:
    - test
  script:
    - docker login registry.krasrm.com -u $DOCKER_USER -p $DOCKER_TOKEN
    - docker push registry.krasrm.com/pahapasha11/new-lk

deploy_test:
  image: alpine:latest
  stage: deploy_test
  only:
    - test
  before_script:
    - echo "$ID_RSA" > /tmp/deploy_key.pem
    - chmod 600 /tmp/deploy_key.pem
  script:
    - apk update && apk add openssh-client
    - ssh -i /tmp/deploy_key.pem -o StrictHostKeyChecking=no $SERVER_USER@$REMOTE_SERVER_IP "docker login registry.krasrm.com -u $DOCKER_USER -p $DOCKER_TOKEN""docker login registry.krasrm.com -u $DOCKER_USER -p $DOCKER_TOKEN"
    - ssh -i $ID_RSA -o StrictHostKeyChecking=no $SERVER_USER@$REMOTE_SERVER_IP "docker pull $DOCKER_IMAGE_NAME"
    - ssh -i $ID_RSA -o StrictHostKeyChecking=no $SERVER_USER@$REMOTE_SERVER_IP "docker container rm -f new-lk-krasrm-com || true"
    - ssh -i $ID_RSA -o StrictHostKeyChecking=no $SERVER_USER@$REMOTE_SERVER_IP "docker run --restart unless-stopped -d -p 8080:80 --name new-lk-krasrm-com $DOCKER_IMAGE_NAME"
